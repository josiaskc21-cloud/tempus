name: Build APK (Spotify queue)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleTempusDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tempus-spotify-queue-apk
          path: app/build/outputs/apk/tempus/debug/*.apk
